# Lives at /volume2/docker/portal on the NAS, next to a .env holding UNSPLASH_ACCESS_KEY.
services:
  portal:
    image: ghcr.io/jives00/portal:latest
    container_name: portal
    ports:
      - "3012:3012"
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
      - NAS_HOST=192.168.0.105
    volumes:
      - /volume2/docker/portal/data:/data
      # Read-write: each Reolink uploads into its own folder here (FTP), Portal writes the daily
      # summaries into <folder>/Summary/, and retention prunes old clips, stills and summaries.
      - /volume2/SecurityCameras:/cameras
      # The DevDash tab: container status and logs (Portal only reads), and the nightly MySQL
      # backup's backup_status.json.
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume2/docker/shared/backups:/backups:ro
    networks:
      - default
      # So the DevDash tab's health checks reach other apps by container name (quest-api:3007, …).
      - shared-db
    restart: unless-stopped

networks:
  shared-db:
    external: true
